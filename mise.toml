[tools]
node = "24"

[tasks.install]
run = "corepack enable pnpm && pnpm install"
description = "Install dependencies"

[tasks.env]
run = "node scripts/generate-env.mjs"
description = "Generate .env pre-filled with task-3 runbook values"

[tasks.attack-sim]
run = "node scripts/attack-sim.mjs"
description = "Rehearsal traffic generator (--target <url> required, --dry to preview)"

[tasks.dev]
run = "pnpm dev"
description = "Run dev server on 127.0.0.1:3100 (loopback only, no auth)"

[tasks.clean]
run = "pnpm clean"
description = "Delete the .next build cache"

[tasks.build]
run = "pnpm build"
description = "Production build"

[tasks.build-clean]
run = "pnpm build:clean"
description = "Production build after clearing the .next cache"

[tasks.start]
run = "pnpm start"
description = "Run production server on 127.0.0.1:3100 (loopback only, no auth)"

[tasks.typecheck]
run = "pnpm typecheck"
description = "TypeScript strict check"
