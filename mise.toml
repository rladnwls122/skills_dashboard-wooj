[tools]
node = "24"

[tasks.install]
run = "corepack enable pnpm && pnpm install"
description = "Install Node dependencies"

[tasks.dev]
run = "pnpm dev"
description = "Run both the Node backend and the Vite frontend dev servers"

[tasks.clean]
run = "pnpm clean"
description = "Delete build outputs (dist)"

[tasks.build]
run = "pnpm build"
description = "Build the frontend (Vite); the backend runs from source"

[tasks.build-clean]
run = "pnpm build:clean"
description = "Clean outputs and build the frontend"

[tasks.start]
run = "pnpm start"
description = "Run the backend and the frontend preview (3100)"

[tasks.typecheck]
run = "pnpm typecheck"
description = "TypeScript strict type check"
