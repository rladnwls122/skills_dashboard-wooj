[tools]
node = "24"

[tasks.install]
run = "corepack enable pnpm && pnpm install"
description = "Install dependencies"

[tasks.dev]
run = "pnpm dev"
description = "Run dev server on :3100"

[tasks.build]
run = "pnpm build"
description = "Production build"

[tasks.start]
run = "pnpm start"
description = "Run production server on :3100"

[tasks.typecheck]
run = "pnpm typecheck"
description = "TypeScript strict check"
