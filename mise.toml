[tools]
node = "24"
go = "latest"

[tasks.install]
run = "corepack enable pnpm && pnpm install && go mod download -C backend"
description = "Install Node and Go dependencies"

[tasks.dev]
run = "pnpm dev"
description = "Run both Go Fiber backend and Vite frontend dev servers"

[tasks.clean]
run = "pnpm clean"
description = "Delete build outputs (dist and api binary)"

[tasks.build]
run = "pnpm build"
description = "Build frontend (Vite) and backend (Go Fiber)"

[tasks.build-clean]
run = "pnpm build:clean"
description = "Clean outputs and build frontend and backend"

[tasks.start]
run = "pnpm start"
description = "Run production backend (api.exe) and frontend preview (3100)"

[tasks.typecheck]
run = "pnpm typecheck"
description = "TypeScript strict type check"
